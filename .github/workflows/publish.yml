name: Publish to Modrinth

# Fires whenever you publish a GitHub Release. The release tag (e.g. v1.4.0-beta.1) and its notes
# become the Modrinth version number and changelog. One matrix job per Minecraft version: each builds
# its own jar (-Ptarget) and uploads it with the matching game version.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: '1.21.11'
            game-versions: |
              1.21.11
          - target: '26.1.2'
            game-versions: |
              26.1
              26.1.1
              26.1.2
          - target: '26.2'
            game-versions: |
              26.2
          - target: '26.3'
            game-versions: |
              26.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon "-Ptarget=${{ matrix.target }}"

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: vbRcbu5L
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/!(*-sources).jar
          name: ElytraWEEE ${{ github.event.release.tag_name }} (MC ${{ matrix.target }})
          version: ${{ github.event.release.tag_name }}+mc${{ matrix.target }}
          changelog: ${{ github.event.release.body }}
          version-type: ${{ contains(github.event.release.tag_name, 'beta') && 'beta' || 'release' }}
          loaders: fabric
          game-versions: ${{ matrix.game-versions }}
          dependencies: |
            fabric-api(required)
            cloth-config(required)
            modmenu(optional)
